name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js (v22 for Capacitor Compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21 (Fixed Java Compiler Mismatch)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync or Add Android Platform
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivo-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
